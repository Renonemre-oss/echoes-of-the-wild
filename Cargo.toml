[workspace]
resolver = "2"
members = ["eotw_sim", "eotw_cli", "eotw_game"]

[workspace.package]
# Versão mínima do Rust. Com uma versão mais antiga, o Cargo diz claramente
# que é preciso atualizar (rustup update) em vez de dar erros de compilação.
# 1.85 é o mínimo do Bevy 0.16.
rust-version = "1.85"

# Os testes de equilíbrio correm milhares de dias simulados. Sem otimização
# demoravam mais de um minuto; com ela, poucos segundos. Só afeta `cargo test`.
[profile.test]
opt-level = 2

# O Bevy é lento sem otimização. Isto otimiza as dependências (o Bevy) ao
# máximo e o nosso código só um pouco, para compilar depressa e correr bem.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
